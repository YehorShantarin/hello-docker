networks:
  shared_network:
    name: app_external
  internal:
    name: app_internal
    internal: true

volumes:
  appdata:

services:
  traefik:
    image: traefik:v3
    command:
      - --providers.swarm=true
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=app_external
      - --entrypoints.web.address=:80
    ports:
      - "8080:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    deploy:
      placement:
        constraints:
          - node.role == manager
    networks:
      - shared_network

  app:
    image: shntrn/docker:hw5
    labels:
      app.name: "course-app"
      app.component: "api"
      app.version: "1.0.0"
    env_file:
      - .env
    environment:
      - APP_STORE=redis
      - APP_REDIS_URL=redis://redis:6379/0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      labels:
        traefik.enable: "true"
        traefik.http.routers.app.rule: "PathPrefix(`/`)"
        traefik.http.routers.app.entrypoints: "web"
        traefik.http.services.app.loadbalancer.server.port: "8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - shared_network
      - internal

  redis:
    image: redis:alpine
    command: redis-server --save 60 1
    labels:
      app.name: "course-app"
      app.component: "cache"
    volumes:
      - appdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
      placement:
        constraints:
          - node.role == manager
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - internal
