apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: course-app
  template:
    metadata:
      labels:
        app: course-app
    spec:
      containers:
        - name: app
          image: shntrn/docker:hw5
          ports:
            - containerPort: 8000
          env:
            - name: APP_STORE
              value: "redis"
            - name: APP_REDIS_URL
              value: "redis://redis:6379/0"
---
apiVersion: v1
kind: Service
metadata:
  name: course-app
spec:
  type: NodePort
  selector:
    app: course-app
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080